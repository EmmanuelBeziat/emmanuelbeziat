name: CI

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - 'public/**'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'index.html'
      - 'postcss.config.js'
      - '.eslintrc.js'
      - '.browserlistrc'

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      VITE_PORT: ${{ vars.VITE_PORT }}
      VITE_API_POSTS: ${{ vars.VITE_API_POSTS }}
      VITE_API_REFS: ${{ vars.VITE_API_REFS }}
      VITE_API_CODES: ${{ vars.VITE_API_CODES }}
      VITE_API_PROJECTS: ${{ vars.VITE_API_PROJECTS }}
      VITE_OG_TITLE: ${{ vars.VITE_OG_TITLE }}
      VITE_OG_URL: ${{ vars.VITE_OG_URL }}
      VITE_OG_IMAGE: ${{ vars.VITE_OG_IMAGE }}
      VITE_OG_DESCRIPTION: ${{ vars.VITE_OG_DESCRIPTION }}
      VITE_SOCIAL_TWITTER: ${{ vars.VITE_SOCIAL_TWITTER }}
      VITE_SOCIAL_FACEBOOK: ${{ vars.VITE_SOCIAL_FACEBOOK }}
      VITE_SOCIAL_GITHUB: ${{ vars.VITE_SOCIAL_GITHUB }}
      VITE_SOCIAL_LINKEDIN: ${{ vars.VITE_SOCIAL_LINKEDIN }}
      VITE_SOCIAL_CODEPEN: ${{ vars.VITE_SOCIAL_CODEPEN }}
      VITE_SOCIAL_INSTAGRAM: ${{ vars.VITE_SOCIAL_INSTAGRAM }}
      VITE_SOCIAL_YOUTUBE: ${{ vars.VITE_SOCIAL_YOUTUBE }}
      VITE_SOCIAL_NPM: ${{ vars.VITE_SOCIAL_NPM }}
      VITE_SOCIAL_BLUESKY: ${{ vars.VITE_SOCIAL_BLUESKY }}
      VITE_PERSO_BIRTHDAY: ${{ vars.VITE_PERSO_BIRTHDAY }}
      VITE_GITHUB_PROFILE: ${{ vars.VITE_GITHUB_PROFILE }}
      VITE_GITHUB_STATS: ${{ vars.VITE_GITHUB_STATS }}
      VITE_GITHUB_LANGUAGES: ${{ vars.VITE_GITHUB_LANGUAGES }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Set build date environment variable
      run: echo "VITE_LAST_BUILD_DATE=$(TZ=Europe/Paris date +'%d/%m/%Y')" >> $GITHUB_ENV

    - name: Run tests
      run: npx vitest run --pool=forks

    - name: Build project
      run: npm run build

    - name: Generate build info
      env:
        COMMIT_SHA: ${{ github.sha }}
        COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
      run: |
        jq -n \
          --arg date "$(TZ=Europe/Paris date +'%d/%m/%Y')" \
          --arg commit "$COMMIT_SHA" \
          --arg message "$COMMIT_MESSAGE" \
          --arg author "$COMMIT_AUTHOR" \
          '{ date: $date, commit: $commit, message: $message, author: $author, tests: "passed" }' \
          > dist/build-info.json

    - name: Create archive of dist folder
      run: tar -czf dist.tar.gz -C dist .

    - name: Deploy to server
      env:
        DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        DEPLOY_SCRIPT: ${{ secrets.DEPLOY_SCRIPT }}
      run: |
        install -m 700 -d ~/.ssh
        printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
        cat > ~/.ssh/config <<EOF
        Host deploy
          HostName $DEPLOY_HOST
          Port $DEPLOY_PORT
          User $DEPLOY_USER
          IdentityFile ~/.ssh/deploy_key
          IdentitiesOnly yes
          StrictHostKeyChecking yes
        EOF

        scp dist.tar.gz deploy:/tmp/dist.tar.gz

        ssh deploy "bash -s -- $(printf '%q ' "$DEPLOY_PATH" "$DEPLOY_SCRIPT")" <<'EOF'
        set -euo pipefail
        mkdir -p "$1"
        cd "$1"
        rm -rf ./*
        tar -xzf /tmp/dist.tar.gz -C .
        chown -R www-data:www-data .
        chmod +x "$2"
        bash "$2"
        rm -f /tmp/dist.tar.gz
        EOF
